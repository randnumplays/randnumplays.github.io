<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cartoon Booklet</title>
<style>
  body { background: lightyellow; font-family: sans-serif; text-align: center; margin: 0; padding: 16px; }
  #page { max-width: 100%; max-height: 75vh; border: 4px solid #1d2a4d; border-radius: 8px; background: white; }
  button { font-size: 22px; padding: 10px 22px; margin: 12px 6px; border: 3px solid #1d2a4d;
           border-radius: 999px; background: #ffc93c; cursor: pointer; }
  button:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<h1>My Cartoon Booklet</h1>

<img id="page" src="assets/gii-the-reboot-starting-up-0a-page1.jpg" alt="Cover">
<p id="counter">Page 1 of 4</p>

<button id="back">Back</button>
<button id="next">Next</button>

<p><a href="index.html">Back home</a></p>

<script>
  // Put your picture names here, in the order you want to read them.
  const pages = ["assets/gii-the-reboot-starting-up-0a-page1.jpg", "assets/gii-the-reboot-starting-up-0a-page2.jpg", "assets/gii-the-reboot-starting-up-0a-page3.jpg", "assets/gii-the-reboot-starting-up-0a-page4.jpg"];
  let current = 0;

  const img = document.getElementById("page");
  const counter = document.getElementById("counter");
  const backBtn = document.getElementById("back");
  const nextBtn = document.getElementById("next");

  function show() {
    img.src = pages[current];
    img.alt = "Page " + (current + 1);
    counter.innerText = "Page " + (current + 1) + " of " + pages.length;
    backBtn.disabled = (current === 0);
    nextBtn.disabled = (current === pages.length - 1);
  }

  function goNext() { if (current < pages.length - 1) { current = current + 1; show(); } }
  function goBack() { if (current > 0) { current = current - 1; show(); } }

  nextBtn.onclick = goNext;
  backBtn.onclick = goBack;

  // Arrow keys work too!
  document.onkeydown = function (e) {
    if (e.key === "ArrowRight") goNext();
    if (e.key === "ArrowLeft") goBack();
  };

  // Swipe on a phone or tablet
  let startX = 0;
  img.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; });
  img.addEventListener("touchend", function (e) {
    const diff = e.changedTouches[0].clientX - startX;
    if (diff < -50) goNext();
    if (diff > 50) goBack();
  });

  show();
</script>

</body>
</html>
